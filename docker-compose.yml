services:
  postgres:
    image: postgres:15-alpine
    container_name: tenira_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tenira_user
      POSTGRES_PASSWORD: tenira_password
      POSTGRES_DB: tenira_db
    ports:
      - "5433:5432"
    volumes:
      - tenira_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tenira_user -d tenira_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tenira_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      PORT: 8000
      ENVIRONMENT: development
      DATABASE_URL: postgresql://tenira_user:tenira_password@postgres:5432/tenira_db
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,*
    volumes:
      - tenira_uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tenira_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  tenira_pg_data:
  tenira_uploads_data:
