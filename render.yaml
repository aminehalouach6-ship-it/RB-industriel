services:
  # 1. Backend Web Service (FastAPI Docker)
  - type: web
    name: tenira-travaux-backend
    runtime: docker
    dockerContext: backend
    dockerfilePath: backend/Dockerfile
    plan: free
    region: frankfurt # ou oregon
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tenira-travaux-db
          property: connectionString
      - key: CORS_ORIGINS
        value: "*"
      - key: ENVIRONMENT
        value: production

  # 2. Frontend Static Site (React Vite)
  - type: web
    name: tenira-travaux-frontend
    runtime: static
    plan: free
    region: frankfurt
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: tenira-travaux-backend
          envVarKey: RENDER_EXTERNAL_URL

databases:
  # 3. Base de données PostgreSQL managée Render
  - name: tenira-travaux-db
    plan: free
    region: frankfurt
    databaseName: tenira_db
    user: tenira_user
