services:
  # 1. Backend Web Service (FastAPI Docker)
  - type: web
    name: rb-industriel-backend
    runtime: docker
    dockerContext: backend
    dockerfilePath: backend/Dockerfile
    plan: free
    region: frankfurt
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: rb-industriel-db
          property: connectionString
      - key: CORS_ORIGINS
        value: "*"
      - key: ENVIRONMENT
        value: production

  # 2. Frontend Static Site (React Vite)
  - type: web
    name: rb-industriel-frontend
    runtime: static
    plan: free
    region: frankfurt
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: rb-industriel-backend
          envVarKey: RENDER_EXTERNAL_URL

databases:
  # 3. Base de données PostgreSQL managée Render (Persistante & Gratuite)
  - name: rb-industriel-db
    plan: free
    region: frankfurt
    databaseName: rb_industriel_db
    user: rb_user
